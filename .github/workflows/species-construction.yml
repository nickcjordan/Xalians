name: Species construction tracker

on:
  pull_request:
    branches: [main]
    paths:
      - 'art/species-construction/**'
      - 'docs/design/species-construction/**'
      - '.github/workflows/species-construction.yml'

jobs:
  tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install image review dependencies
        run: python3 -m pip install -r art/species-views/requirements.txt
      - name: Test dependency and approval tracking
        run: python3 -m unittest discover -s art/species-construction/tests -v
