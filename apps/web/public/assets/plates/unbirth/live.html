  <title id="scene-title">The Genesis Prototype on Floria</title>
  <desc id="scene-desc">A heavy industrial machine on wet rock, ringed by the growth its own seeds have raised, lets glowing seeds down a chute into a flood in a storm; the current spreads them across the plain, where some split and larvae swim out and others catch on rock and sprout; out in the distance the storm whips the water into whitecaps; far off a colossal tree rises from an island of young forest, its canopy spread under the clouds.</desc>

<!-- storm ceiling: the cloud mass and its hanging lobes, their undersides in relief -->
<!-- the rain-filled air right around the Generator lit by it, gone well below the cloud -->
</svg>
